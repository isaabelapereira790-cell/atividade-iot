<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afazeres — suas tarefas na nuvem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- TELA DE LOGIN / CADASTRO -->
  <main id="auth-screen" class="screen">
    <section class="auth-card">
      <h1>Afazeres</h1>
      <p class="lead">Entre para ver suas tarefas em qualquer dispositivo.</p>
      <form id="auth-form" novalidate>
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">Senha (mínimo 6 caracteres)</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        <p id="auth-error" class="error" role="alert" hidden></p>
        <div class="row">
          <button type="submit" id="btn-login" class="primary">Entrar</button>
          <button type="button" id="btn-signup">Criar conta</button>
        </div>
      </form>
    </section>
  </main>

  <!-- TELA DO APP -->
  <main id="app-screen" class="screen" hidden>
    <header class="topbar">
      <h1>Afazeres</h1>
      <div>
        <span id="user-email"></span>
        <button id="btn-logout">Sair</button>
      </div>
    </header>

    <form id="task-form" class="task-form">
      <label for="task-input" class="sr-only">Nova tarefa</label>
      <input id="task-input" type="text" placeholder="O que precisa ser feito?" maxlength="120" required>
      <button type="submit" class="primary">Adicionar tarefa</button>
    </form>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>Nenhuma tarefa ainda. Adicione a primeira acima.</p>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
